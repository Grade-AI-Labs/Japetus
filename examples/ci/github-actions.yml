# Sample workflow using a narrow-scoped client credential against talentech-standards.
# See docs/ci-client-credentials.md for the detailed walk-through.

name: talentech-standards smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch talentech-standards token
        id: token
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          CLIENT_ID: ${{ secrets.GRADE_STANDARDS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GRADE_STANDARDS_CLIENT_SECRET }}
        run: |
          TOKEN=$(curl -sS -X POST "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "scope=api://talentech-standards/.default" \
            -d "grant_type=client_credentials" | jq -r .access_token)
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Read the PR review checklist
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          GRADE_STANDARDS_URL: ${{ vars.GRADE_STANDARDS_URL }}
        run: |
          curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -X POST "${GRADE_STANDARDS_URL}/mcp" \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "resources/read",
              "params": { "uri": "conventions://prs/review-checklist" }
            }'
